# The template conformance suite (.github/scripts/conformance.py, managed by the platform): the built
# image does what every document intake repo must. An upload is declared with a token like the BFF's.
image: "ci"  # the tag CI builds
command: "uv run document-intake"  # conformance.py local: the app as a process
# /metrics is on the management port (MANAGEMENT_PORT, 8081), apart from the API.
metrics: http://127.0.0.1:8081/metrics
port: 8080
audience: document-intake
env:
  INTAKE_OIDC_ISSUER: "{issuer}"
  INTAKE_OIDC_JWKS_URL: "{jwks}"
  INTAKE_STORAGE: memory
  INTAKE_FLAGS_URL: "{ofrep}"
  INTAKE_PRODUCT: conformance
  INTAKE_ENVIRONMENT: ci
  INTAKE_AUDIT_SINK: log
steps:
  - method: POST
    path: /documents
    token: {scope: "documents:write documents:read", organization: {north-clinic: {}}}
    json: {type: lab-report, filename: "cbc.pdf", format: pdf, size: 2048}
    expect: [201]
    save: {doc: "json:id"}
  - method: GET
    path: /documents/{doc}
    token: {scope: "documents:read", organization: {north-clinic: {}}}
# GET /documents/{id} reads the example feature's flag (app.example_flag) through OFREP.
checks: [audit, tracing, events, flags]
