[project]
name = "document-intake"
version = "0.1.0"
description = "Valxel document intake template: authenticated uploads to quarantine, malware scanning, type checks, extraction through the LLM gateway, a review queue and tenant-scoped access."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pyyaml>=6.0,<7",
  "pyjwt[crypto]>=2.15.1,<3",
  "boto3>=1.40,<2",
  "jsonschema>=4.20,<5",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "openfeature-sdk>=0.10,<1",
  "openfeature-provider-ofrep>=0.3,<1",
  "confluent-kafka>=2.16,<3",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-psycopg>=0.66b2",
  "opentelemetry-instrumentation-httpx>=0.66b2",
  "opentelemetry-instrumentation-requests>=0.66b2",
  "sentry-sdk>=2.72,<3",
  "prometheus-client>=0.23,<1",
]

[project.scripts]
document-intake = "intake.app:main"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17", "mypy>=2.4", "types-pyyaml", "types-jsonschema", "boto3-stubs[s3]"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
strict = true
packages = ["intake"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=intake --cov-report=term --cov-report=xml --junitxml=reports/junit.xml"

[tool.coverage.report]
fail_under = 90
